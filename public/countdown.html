<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عداد امتحانات زوزو 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf6ff 0%, #e8f4ff 50%, #fff8f0 100%);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #1e1b4b;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 900;
      background: linear-gradient(90deg, #7c3aed, #db2777, #7c3aed);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }

    /* ── Quote Banner ── */
    .quote-banner {
      max-width: 700px;
      margin: 0 auto 2.5rem;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      border-radius: 1.5rem;
      padding: 1.5rem 2rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(124,58,237,.25);
      position: relative;
      overflow: hidden;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote-banner::before {
      content: '✨';
      position: absolute;
      font-size: 5rem;
      opacity: .08;
      top: -10px;
      right: 10px;
    }
    .quote-text {
      font-size: clamp(1.1rem, 3.5vw, 1.45rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
      animation: fadeQuote .6s ease;
    }
    @keyframes fadeQuote {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .quote-dots {
      display: flex;
      justify-content: center;
      gap: .4rem;
      margin-top: .8rem;
    }
    .quote-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      display: inline-block;
      transition: background .3s;
    }
    .quote-dots span.active { background: #fff; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 2px solid rgba(124,58,237,.12);
      border-radius: 1.25rem;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 4px 20px rgba(124,58,237,.08);
      transition: transform .2s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(124,58,237,.15); }

    .card.next {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,.15), 0 8px 32px rgba(124,58,237,.2);
    }
    .card.next::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .card.done {
      opacity: .6;
      border-color: rgba(0,0,0,.08);
      box-shadow: none;
    }

    /* ── Badge row ── */
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .badge {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .25rem .7rem;
      border-radius: 999px;
    }
    .badge.next-badge {
      background: #7c3aed;
      color: #fff;
      animation: pulse-badge 2s ease-in-out infinite;
    }
    @keyframes pulse-badge {
      0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,.4); }
      50%      { box-shadow: 0 0 0 7px rgba(124,58,237,0); }
    }
    .badge.done-badge {
      background: #dcfce7;
      color: #16a34a;
      border: 1px solid #86efac;
    }
    .badge.upcoming-badge {
      background: #ede9fe;
      color: #7c3aed;
      border: 1px solid #c4b5fd;
    }
    .exam-num {
      font-size: .72rem;
      color: #a1a1aa;
      font-weight: 600;
    }

    /* ── Subject ── */
    .subject {
      font-size: clamp(1.1rem, 3vw, 1.3rem);
      font-weight: 800;
      color: #1e1b4b;
      text-align: right;
      margin-bottom: .25rem;
    }
    .subject-en {
      font-size: .78rem;
      color: #a1a1aa;
      text-align: left;
      direction: ltr;
      margin-bottom: 1rem;
    }

    /* ── Date row ── */
    .date-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.25rem;
      direction: ltr;
    }
    .date-text { font-size: .82rem; color: #6b7280; }
    .date-time { margin-right: auto; font-size: .78rem; color: #a1a1aa; }

    /* ── Countdown ── */
    .countdown {
      display: flex;
      gap: .6rem;
      direction: ltr;
      justify-content: center;
    }
    .unit {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
    }
    .digit {
      background: linear-gradient(135deg, #f5f3ff, #ede9fe);
      border: 1.5px solid #c4b5fd;
      border-radius: .65rem;
      width: 100%;
      padding: .6rem .25rem;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      color: #7c3aed;
    }
    .card.next .digit {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-color: #7c3aed;
      color: #fff;
    }
    .card.done .digit {
      background: #f4f4f5;
      border-color: #e4e4e7;
      color: #a1a1aa;
    }
    .label {
      font-size: .62rem;
      color: #9ca3af;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ── Done ── */
    .done-msg {
      text-align: center;
      font-size: .9rem;
      color: #16a34a;
      font-weight: 700;
      margin-top: .5rem;
      display: none;
    }
    .card.done .done-msg { display: block; }
    .card.done .countdown { display: none; }

    /* ── Duration ── */
    .duration {
      margin-top: 1.1rem;
      text-align: center;
      font-size: .72rem;
      color: #9ca3af;
    }
    .duration span {
      background: #f9fafb;
      border-radius: 999px;
      padding: .2rem .75rem;
      border: 1px solid #e5e7eb;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      margin-top: 3rem;
      color: #d1d5db;
      font-size: .75rem;
    }

    @media (max-width: 480px) { .label { font-size: .55rem; } }

    /* ── Pomodoro Section ── */
    .pomo-wrap {
      max-width: 480px;
      margin: 2.5rem auto;
      background: #fff;
      border: 2px solid rgba(124,58,237,.15);
      border-radius: 1.5rem;
      padding: 2rem 1.75rem;
      box-shadow: 0 4px 24px rgba(124,58,237,.1);
      text-align: center;
    }
    .pomo-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #7c3aed;
      margin-bottom: 1.5rem;
      letter-spacing: .02em;
    }
    .pomo-ring {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 1.5rem;
    }
    .pomo-ring svg { transform: rotate(-90deg); }
    .pomo-ring .track  { fill: none; stroke: #ede9fe; stroke-width: 10; }
    .pomo-ring .prog   { fill: none; stroke: url(#pomoGrad); stroke-width: 10;
                         stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
    .pomo-time {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pomo-clock {
      font-size: 2.6rem;
      font-weight: 900;
      font-family: 'Courier New', monospace;
      color: #1e1b4b;
      line-height: 1;
    }
    .pomo-mode-label {
      font-size: .72rem;
      color: #a1a1aa;
      margin-top: .3rem;
      font-weight: 600;
    }
    /* preset buttons */
    .pomo-presets {
      display: flex;
      gap: .5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .preset-btn {
      background: #f5f3ff;
      border: 1.5px solid #c4b5fd;
      color: #7c3aed;
      font-size: .8rem;
      font-weight: 700;
      padding: .35rem .8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .preset-btn:hover   { background: #ede9fe; transform: scale(1.05); }
    .preset-btn.active  { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    /* controls */
    .pomo-controls {
      display: flex;
      gap: .75rem;
      justify-content: center;
    }
    .pomo-btn {
      border: none;
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 700;
      padding: .6rem 1.6rem;
      cursor: pointer;
      transition: transform .1s, box-shadow .15s;
    }
    .pomo-btn:active { transform: scale(.96); }
    .btn-start {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,.3);
    }
    .btn-start:hover { box-shadow: 0 6px 20px rgba(124,58,237,.4); }
    .btn-reset {
      background: #f4f4f5;
      color: #6b7280;
    }
    .btn-reset:hover { background: #e4e4e7; }
    /* done flash */
    @keyframes pomoDone {
      0%,100% { background: #fff; }
      50%      { background: #fdf4ff; }
    }
    .pomo-wrap.done { animation: pomoDone 0.6s ease 3; }
  </style>
</head>
<body>

<header>
  <h1>💜 زوزو راح توصل للقمة 💜</h1>
</header>

<!-- Quote Banner -->
<div class="quote-banner">
  <div>
    <div class="quote-text" id="quote-text"></div>
    <div class="quote-dots" id="quote-dots"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- ── Pomodoro Timer ── -->
<div class="pomo-wrap" id="pomoWrap">
  <div class="pomo-title">⏱ مؤقت بومودورو</div>

  <div class="pomo-presets">
    <button class="preset-btn active" data-min="5">5 د</button>
    <button class="preset-btn" data-min="10">10 د</button>
    <button class="preset-btn" data-min="15">15 د</button>
    <button class="preset-btn" data-min="30">30 د</button>
    <button class="preset-btn" data-min="45">45 د</button>
    <button class="preset-btn" data-min="60">60 د</button>
  </div>

  <div class="pomo-ring">
    <svg width="170" height="170" viewBox="0 0 170 170">
      <defs>
        <linearGradient id="pomoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#7c3aed"/>
          <stop offset="100%" stop-color="#db2777"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="85" cy="85" r="75"/>
      <circle class="prog"  cx="85" cy="85" r="75" id="pomoProg"
              stroke-dasharray="471" stroke-dashoffset="0"/>
    </svg>
    <div class="pomo-time">
      <div class="pomo-clock" id="pomoClock">05:00</div>
      <div class="pomo-mode-label" id="pomoLabel">ابدئي التركيز</div>
    </div>
  </div>

  <div class="pomo-controls">
    <button class="pomo-btn btn-start" id="pomoStartBtn" onclick="pomoToggle()">▶ ابدئي</button>
    <button class="pomo-btn btn-reset" onclick="pomoReset()">↺ إعادة</button>
  </div>
</div>

<footer>يتم التحديث كل ثانية · توقيت الأردن (UTC+3)</footer>

<script>
  const QUOTES = [
    'راح تفرحينا يا زوزو بالمعدل العالي 🌟',
    'دكتورة المستقبل زوزو بإذن الله 👩‍⚕️',
    'راح ترفعين راسنا يا بطلة 🏆',
    'زوزو راح توصل للقمة 🚀',
    'تعبك راح يثمر نجاح 🌸',
    'راح تكونين فخر لنا كلنا ❤️',
    'زوزو راح تحقق أحلامها ✨',
    'مستقبلك راح يكون مشرق ☀️',
    'راح نشوفك في أعلى المراتب 🎯',
    'زوزو راح تثبت نفسها 💪',
    'راح تتخرجين بامتياز 🎓',
    'نجاحك راح يكون حديث الكل 🌺',
    'راح تحققين كل أهدافك 🌈',
    'زوزو راح تبدع أكثر وأكثر 💡',
    'الأيام الجاية راح تحمل لك إنجازات 🌻',
    'راح تكونين قصة نجاح يحكونها 📖',
    'زوزو راح تتفوق كعادتها 🥇',
    'راح توصلين لأحلامك خطوة خطوة 👣',
    'مستقبلك راح يكون مليان نجاح 🎉',
    'زوزو راح تبهر الجميع 🌟',
    'تعبك راح يظهر بنتائج عظيمة 💎',
    'راح تحققين أعلى الدرجات 📚',
    'زوزو راح تلمع في سماء النجاح ⭐',
    'راح تكونين قد التحدي دائمًا 🦋',
    'زوزو راح تصنع الفرق 🌹',
    'الأيام الجاية راح تكون أجمل 🌄',
    'راح نحتفل فيك قريب يا زوزو 🎊',
    'زوزو راح ترفع سقف الطموح 🏅',
    'راح نشوف اسمك في القمة ✅',
    'راح نشوفك دكتورة بإذن الله 👩‍🎓',
    'زوزو راح تفرح قلبنا دائمًا 💜',
    'الأيام الجاية راح تثبت إنك الأفضل 🌠',
  ];

  const EXAMS = [
    { subject:'التربية الإسلامية', subEn:'Islamic Education (Specialized)', dateStr:'2026-06-25T07:00:00Z', day:'الخميس', duration:'ساعة ونصف' },
    { subject:'اللغة الإنجليزية (متقدم)', subEn:'Advanced English', dateStr:'2026-07-06T07:00:00Z', day:'الإثنين', duration:'ساعتان' },
    { subject:'الكيمياء', subEn:'Chemistry', dateStr:'2026-07-11T07:00:00Z', day:'السبت', duration:'ساعتان' },
    { subject:'العلوم الحياتية', subEn:'Biology', dateStr:'2026-07-18T07:00:00Z', day:'السبت', duration:'ساعتان' },
  ];

  /* ── Quote rotator ── */
  let qi = 0;
  const qText = document.getElementById('quote-text');
  const qDots = document.getElementById('quote-dots');

  QUOTES.forEach((_, i) => {
    const d = document.createElement('span');
    if (i === 0) d.className = 'active';
    qDots.appendChild(d);
  });

  function showQuote(i) {
    qText.style.animation = 'none';
    qText.offsetHeight; // reflow
    qText.style.animation = '';
    qText.textContent = QUOTES[i];
    qDots.querySelectorAll('span').forEach((d, j) => d.className = j === i ? 'active' : '');
  }

  showQuote(0);
  setInterval(() => { qi = (qi + 1) % QUOTES.length; showQuote(qi); }, 4000);

  /* ── Helpers ── */
  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('ar-JO', {
      timeZone: 'Asia/Amman', day:'2-digit', month:'long', year:'numeric'
    });
  }

  /* ── Build cards ── */
  const grid = document.getElementById('grid');
  const cards = EXAMS.map((exam, i) => {
    const target = new Date(exam.dateStr).getTime();
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="badge-row">
        <span class="badge upcoming-badge" id="badge-${i}">قادم</span>
        <span class="exam-num">امتحان ${i+1} / ${EXAMS.length}</span>
      </div>
      <div class="subject">${exam.subject}</div>
      <div class="subject-en">${exam.subEn}</div>
      <div class="date-row">
        <span>📅</span>
        <span class="date-text">${exam.day}، ${formatDate(exam.dateStr)}</span>
        <span class="date-time">10:00 ص</span>
      </div>
      <div class="countdown" id="cd-${i}">
        <div class="unit"><div class="digit" id="d-${i}">--</div><div class="label">أيام</div></div>
        <div class="unit"><div class="digit" id="h-${i}">--</div><div class="label">ساعات</div></div>
        <div class="unit"><div class="digit" id="m-${i}">--</div><div class="label">دقائق</div></div>
        <div class="unit"><div class="digit" id="s-${i}">--</div><div class="label">ثواني</div></div>
      </div>
      <div class="done-msg" id="done-${i}">✓ تم الامتحان بنجاح</div>
      <div class="duration"><span>⏱ مدة الامتحان: ${exam.duration}</span></div>
    `;
    grid.appendChild(card);
    return { card, target };
  });

  /* ── Tick ── */
  function tick() {
    const now = Date.now();
    let nextIdx = -1;
    for (let i = 0; i < cards.length; i++) {
      if (cards[i].target > now) { nextIdx = i; break; }
    }

    cards.forEach(({ card, target }, i) => {
      const diff = target - now;
      const badge = document.getElementById(`badge-${i}`);

      if (diff <= 0) {
        card.classList.remove('next');
        card.classList.add('done');
        badge.className = 'badge done-badge';
        badge.textContent = '✓ منتهي';
      } else {
        card.classList.remove('done');
        document.getElementById(`d-${i}`).textContent = pad(Math.floor(diff/86400000));
        document.getElementById(`h-${i}`).textContent = pad(Math.floor((diff%86400000)/3600000));
        document.getElementById(`m-${i}`).textContent = pad(Math.floor((diff%3600000)/60000));
        document.getElementById(`s-${i}`).textContent = pad(Math.floor((diff%60000)/1000));

        if (i === nextIdx) {
          card.classList.add('next');
          badge.className = 'badge next-badge';
          badge.textContent = '▶ التالي';
        } else {
          card.classList.remove('next');
          badge.className = 'badge upcoming-badge';
          badge.textContent = 'قادم';
        }
      }
    });
  }

  tick();
  setInterval(tick, 1000);

  /* ── Pomodoro ── */
  const CIRC = 2 * Math.PI * 75; // 471
  let pomoTotal = 5 * 60;
  let pomoLeft  = pomoTotal;
  let pomoTimer = null;
  let pomoRunning = false;

  const clock    = document.getElementById('pomoClock');
  const label    = document.getElementById('pomoLabel');
  const prog     = document.getElementById('pomoProg');
  const startBtn = document.getElementById('pomoStartBtn');
  const wrap     = document.getElementById('pomoWrap');

  function pomoRender() {
    const m = Math.floor(pomoLeft / 60);
    const s = pomoLeft % 60;
    clock.textContent = pad(m) + ':' + pad(s);
    const pct = pomoLeft / pomoTotal;
    prog.style.strokeDashoffset = CIRC * (1 - pct);
  }

  function pomoToggle() {
    if (pomoRunning) {
      clearInterval(pomoTimer);
      pomoRunning = false;
      startBtn.textContent = '▶ استمري';
      label.textContent = 'متوقف مؤقتاً';
    } else {
      if (pomoLeft === 0) pomoReset();
      pomoRunning = true;
      startBtn.textContent = '⏸ إيقاف';
      label.textContent = 'ركزي يا زوزو! 💪';
      pomoTimer = setInterval(() => {
        pomoLeft--;
        pomoRender();
        if (pomoLeft <= 0) {
          clearInterval(pomoTimer);
          pomoRunning = false;
          startBtn.textContent = '▶ ابدئي';
          label.textContent = 'أحسنتِ! استريحي 🌸';
          wrap.classList.add('done');
          setTimeout(() => wrap.classList.remove('done'), 2000);
          try { new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAA').play(); } catch(e){}
        }
      }, 1000);
    }
  }

  function pomoReset() {
    clearInterval(pomoTimer);
    pomoRunning = false;
    pomoLeft = pomoTotal;
    startBtn.textContent = '▶ ابدئي';
    label.textContent = 'ابدئي التركيز';
    pomoRender();
  }

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pomoRunning) return;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      pomoTotal = parseInt(btn.dataset.min) * 60;
      pomoLeft  = pomoTotal;
      pomoRender();
      label.textContent = 'ابدئي التركيز';
    });
  });

  pomoRender();
</script>
</body>
</html>
